<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
<title>Esri | GeoSearch</title>

<!-- Calcite Design System -->
<link rel="stylesheet" href="https://js.arcgis.com/calcite-components/3.1.1/calcite.css" />
<script type="module" src="https://js.arcgis.com/calcite-components/3.1.1/calcite.esm.js"></script>

<!-- ArcGIS Maps SDK for JavaScript — Map components -->
<script type="module" blocking="render" src="https://js.arcgis.com/5.1"></script>

<style>
  :root{
    --qe-esri-blue: #007ac2;
    --qe-ai-violet: #6d29cc;
    --qe-ai-violet-soft: #f3ecfd;
    --qe-ink: #151515;
    --qe-panel-radius: 0px;
    --qe-shadow: none;
  }

  html, body{ height:100%; margin:0; padding:0; font-family: var(--calcite-sans-family, "Avenir Next","Helvetica Neue",Arial,sans-serif); }
  body{ position:relative; overflow:hidden; }

  #shell{ height:100vh; width:100vw; }
  arcgis-map{ height:100%; width:100%; }

  /* ---------- boot scrim ---------- */
  #bootScrim{ --calcite-scrim-background: #0b1622f2; }
  .boot-copy{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    color:#eaf2fb; text-align:center; padding:0 24px; max-width: 400px; width: 100%;
  }
  .boot-title{ font-size:1.05rem; font-weight:600; letter-spacing:.01em; }
  .boot-log{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:.78rem; line-height:1.65; color:#8fb8e8; min-height:2.9em;
    text-align:left; white-space:pre; width: 100%;
  }
  .boot-log .ok{ color:#5ee6a8; }
  .boot-log .err{ color:#ff6b6b; }

  /* ---------- top navigation ---------- */
  calcite-navigation{ --calcite-navigation-logo-icon-color: var(--qe-esri-blue); }
  .qe-wordmark{ font-weight:700; letter-spacing:-0.01em; }
  .qe-wordmark span{ color: var(--qe-ai-violet); }

  /* ---------- floating search (top left, rectangular) ---------- */
  .qe-search-float{
    position:absolute; top:16px; left:16px;
    width:min(440px, calc(100vw - 32px)); z-index:40;
  }
  .qe-search-card{
    background:#fff; border-radius:0;
    border:1px solid #c8c8c8; overflow:hidden;
  }
  .qe-search-row{ display:flex; align-items:flex-start; gap:8px; padding:8px 8px 8px 12px; }
  .qe-search-row calcite-icon{ color: var(--qe-ai-violet); flex:none; margin-top: 8px; }
  .qe-search-row calcite-text-area {
    flex: 1;
    --calcite-input-border-radius: 0px;
  }
  .qe-search-row calcite-button{ --calcite-button-corner-radius: 0px; margin-top: 4px; }

  /* ---------- loading progress bar ---------- */
  .qe-progress-bar {
    width: 100%;
    height: 3px;
    background: #e4e4e4;
    position: relative;
    overflow: hidden;
  }
  .qe-progress-fill {
    height: 100%;
    width: 0%;
    background: var(--qe-ai-violet);
    transition: width 0.15s ease-out;
  }

  .qe-results{ border-top:1px solid #eceff2; max-height:min(52vh, 480px); overflow-y:auto; }
  .qe-results-meta{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px 4px; font-size:.78rem; color:#6a6a6a;
  }
  .qe-empty{ padding:22px 16px 26px; text-align:center; color:#7a7a7a; font-size:.85rem; }

  calcite-list-item::part(container){ cursor:pointer; }

  /* ---------- context layer chips ---------- */
  .qe-context-chips{ padding:6px 16px 8px; display:flex; flex-wrap:wrap; gap:6px; border-top:1px solid #eceff2; }
  .qe-context-chips:empty{ display:none; }
  .qe-chip{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 10px; border-radius:12px; font-size:.72rem; font-weight:500;
    border:1px solid #c8c8c8; background:#f8f8f8; cursor:pointer;
    transition: background .15s, border-color .15s;
  }
  .qe-chip.active{ background:#e6f0fb; border-color:var(--qe-esri-blue); color:var(--qe-esri-blue); }
  .qe-chip .qe-chip-dot{
    width:8px; height:8px; border-radius:50%; flex:none;
  }

  /* ---------- bottom-right wayback time control ---------- */
  .qe-timeline-float{
    position:absolute; right:16px; bottom:34px; z-index:35;
    background:#fff; border-radius:0px;
    border:1px solid #c8c8c8; padding:12px 14px 14px; width:250px;
  }
  .qe-timeline-head{ display:flex; align-items:center; gap:6px; font-size:.72rem; font-weight:600; color:#55606a; text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
  .qe-timeline-head calcite-icon{ color: var(--qe-esri-blue); }
  .qe-year-pills{ display:flex; gap:6px; margin-bottom:10px; }
  .qe-year-pill{ flex:1; --calcite-button-corner-radius: 0px; }
  .qe-ref-row{ display:flex; align-items:center; justify-content:space-between; border-top:1px solid #f0f0f0; padding-top:9px; }
  .qe-ref-row .lbl{ font-size:.8rem; color:#3b3b3b; }
  .qe-imagery-caption{ font-size:.7rem; color:#8a8a8a; margin-top:8px; line-height:1.4; }

  arcgis-map::part(attribution){ margin-right:270px; }
</style>
</head>
<body>

  <!-- ============ boot sequence — prompts for Google API Key ============ -->
  <calcite-scrim id="bootScrim">
    <div class="boot-copy">
      <calcite-loader id="bootLoader" scale="l" label="Starting ESRI Earth Engine" hidden></calcite-loader>
      <div class="boot-title" id="bootTitle">Enter your Google API Key to start</div>

      <div id="apiKeyForm" style="display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 10px;">
        <calcite-input-text 
          id="apiKeyInput" 
          type="password" 
          placeholder="Enter API Key" 
          label="Google API Key" 
          clearable>
        </calcite-input-text>
        <calcite-button id="initBtn" appearance="solid" kind="brand" width="full">
          Initialize Engine
        </calcite-button>
      </div>

      <div class="boot-log" id="bootLog"></div>
    </div>
  </calcite-scrim>

  <calcite-shell id="shell" content-behind>

    <calcite-navigation slot="header" style="border-block-end:1px solid #e4e4e4;">
      <calcite-navigation-logo slot="logo" icon="esri-logo" heading-tag="span">
        <span slot="heading" class="qe-wordmark">ESRI Earth Engine</span>
        <span slot="description">Natural-language geospatial search · built for ArcGIS</span>
      </calcite-navigation-logo>
    </calcite-navigation>

    <arcgis-map id="mapEl" basemap="osm" center="-121.95,37.42" zoom="9">
      <arcgis-zoom slot="top-right"></arcgis-zoom>
    </arcgis-map>

    <!-- ============ floating natural-language search (top left) ============ -->
    <div class="qe-search-float">
      <div class="qe-search-card">
        <div class="qe-search-row">
          <calcite-icon icon="sparkle" scale="m"></calcite-icon>
          <calcite-text-area id="queryInput" placeholder="What do you want to find?" rows="2" resize="vertical"></calcite-text-area>
          <calcite-button id="runBtn" icon-start="search" disabled>Search</calcite-button>
        </div>

        <!-- ============ Progress Bar ============ -->
        <div class="qe-progress-bar" id="progressBarWrap" hidden>
          <div class="qe-progress-fill" id="progressFill"></div>
        </div>

        <div class="qe-results" id="resultsWrap" hidden>
          <div class="qe-results-meta">
            <span id="resultsMeta">—</span>
          </div>
          <div class="qe-context-chips" id="contextChips"></div>
          <calcite-list id="resultsList" selection-appearance="border" label="ESRI Earth Engine results"></calcite-list>
        </div>
      </div>
    </div>

    <!-- ============ bottom-right Wayback time control ============ -->
    <div class="qe-timeline-float">
      <div class="qe-timeline-head"><calcite-icon icon="time" scale="s"></calcite-icon> Imagery vintage</div>
      <div class="qe-year-pills" id="yearPills">
        <calcite-button class="qe-year-pill" data-year="none" scale="s" appearance="solid" kind="brand">Map</calcite-button>
        <calcite-button class="qe-year-pill" data-year="2014" scale="s" appearance="outline" kind="neutral">2014</calcite-button>
        <calcite-button class="qe-year-pill" data-year="2022" scale="s" appearance="outline" kind="neutral">2022</calcite-button>
        <calcite-button class="qe-year-pill" data-year="latest" scale="s" appearance="outline" kind="neutral">2026</calcite-button>
      </div>
      <div class="qe-ref-row">
        <span class="lbl">Reference labels</span>
        <calcite-switch id="refToggle" scale="s" disabled></calcite-switch>
      </div>
      <div class="qe-imagery-caption" id="imageryCaption">World Imagery Wayback · Esri Living Atlas</div>
    </div>

  </calcite-shell>

<script type="module">
  const bootLog     = document.getElementById("bootLog");
  const bootScrim   = document.getElementById("bootScrim");
  const bootLoader  = document.getElementById("bootLoader");
  const bootTitle   = document.getElementById("bootTitle");
  const apiKeyForm  = document.getElementById("apiKeyForm");
  const apiKeyInput = document.getElementById("apiKeyInput");
  const initBtn     = document.getElementById("initBtn");
  const runBtn      = document.getElementById("runBtn");
  const queryInput  = document.getElementById("queryInput");
  const resultsWrap = document.getElementById("resultsWrap");
  const resultsMeta = document.getElementById("resultsMeta");
  const resultsList = document.getElementById("resultsList");
  const contextChips = document.getElementById("contextChips");
  const yearPills   = document.getElementById("yearPills");
  const refToggle   = document.getElementById("refToggle");
  const imageryCaption = document.getElementById("imageryCaption");
  const mapEl       = document.getElementById("mapEl");
  const progressBarWrap = document.getElementById("progressBarWrap");
  const progressFill     = document.getElementById("progressFill");

  const API_BASE = window.location.origin;
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  
  let userApiKey = "";

  function typeLine(text, cls){
    return new Promise(resolve => {
      const line = document.createElement("div");
      if (cls) line.className = cls;
      bootLog.appendChild(line);
      let i = 0;
      const t = setInterval(() => {
        line.textContent = text.slice(0, ++i);
        if (i >= text.length){ clearInterval(t); resolve(); }
      }, 12);
    });
  }

  // ---------------------------------------------------------------
  // 1. Boot sequence
  // ---------------------------------------------------------------
  async function handleInitialization() {
    const key = apiKeyInput.value ? apiKeyInput.value.trim() : "";
    if (!key) {
      alert("Please enter your Google API key.");
      return;
    }

    userApiKey = key;
    apiKeyForm.style.display = "none";
    bootLoader.hidden = false;
    bootTitle.textContent = "Initializing ESRI Earth Engine...";
    bootLog.innerHTML = "";

    await typeLine("Initializing engine with provided key...");
    
    try {
      const resp = await fetch(`${API_BASE}/api/init`, { 
        method: "POST", 
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ api_key: key }),
        signal: AbortSignal.timeout(600000)
      });

      if (!resp.ok) {
        const errJson = await resp.json().catch(() => ({ detail: "Unknown server error" }));
        throw new Error(errJson.detail || `HTTP ${resp.status}`);
      }

      await typeLine("Engine ready!", "ok");
      await sleep(400);

      runBtn.loading = false;
      runBtn.disabled = false;
      bootScrim.hidden = true;
    } catch (err) {
      await typeLine(`Failed: ${err.message}`, "err");
      bootTitle.textContent = "Initialization failed. Try again.";
      bootLoader.hidden = true;
      apiKeyForm.style.display = "flex";
    }
  }

  initBtn.addEventListener("click", handleInitialization);
  apiKeyInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleInitialization();
  });

  // ---------------------------------------------------------------
  // 2. Map Setup & Layer Handlers
  // ---------------------------------------------------------------
  let view, waybackLayers = {}, refLayer, Graphic, Point, Polyline, Polygon, GraphicsLayerCtor;
  let resultsLayer, supportingLayer;

  let currentBundle = null;
  let contextGraphicsLayers = {};  // artifactId -> real esri GraphicsLayer
  let supportingGraphics = {};     // featureIdx -> { checkLabel: [Graphic, ...] }
  let supportingVisible = {};
  let featureCentroids = [];

  const TYPE_COLORS = {
    geocode: { fill: [200, 120, 0, 0.25], stroke: [200, 120, 0, 0.85], hex: "#c87800" },
    demo:    { fill: [0, 122, 194, 0.25], stroke: [0, 122, 194, 0.85], hex: "#007ac2" },
    vision:  { fill: [34, 139, 87, 0.25], stroke: [34, 139, 87, 0.85], hex: "#228b57" },
    osm:     { fill: [180, 60, 60, 0.25], stroke: [180, 60, 60, 0.85], hex: "#b43c3c" },
    change:  { fill: [109, 41, 204, 0.25], stroke: [109, 41, 204, 0.85], hex: "#6d29cc" },
  };

  const VARIATION_SHADES = [
    { fill: [0, 122, 194, 0.25], stroke: [0, 122, 194, 0.85] },
    { fill: [0, 150, 220, 0.25], stroke: [0, 150, 220, 0.85] },
    { fill: [0, 90, 160, 0.25], stroke: [0, 90, 160, 0.85] },
    { fill: [60, 160, 210, 0.25], stroke: [60, 160, 210, 0.85] },
  ];

  const GEOCODE_VARIATION_SHADES = [
    { fill: [200, 120, 0, 0.25], stroke: [200, 120, 0, 0.85] },
    { fill: [220, 150, 30, 0.25], stroke: [220, 150, 30, 0.85] },
    { fill: [170, 100, 0, 0.25], stroke: [170, 100, 0, 0.85] },
    { fill: [230, 170, 50, 0.25], stroke: [230, 170, 50, 0.85] },
  ];

  function parseDateFromTitle(title){
    const m = /(\d{4}-\d{2}-\d{2})/.exec(title || "");
    return m ? new Date(m[1]) : null;
  }

  function nearestByDate(releases, target){
    return releases.reduce((best, r) =>
      Math.abs(r.date - target) < Math.abs(best.date - target) ? r : best
    );
  }

  async function setupMap(){
    const [WebTileLayer, VectorTileLayer, GraphicsLayer, GraphicMod, PointMod, PolylineMod, PolygonMod] = await $arcgis.import([
      "esri/layers/WebTileLayer",
      "esri/layers/VectorTileLayer",
      "esri/layers/GraphicsLayer",
      "esri/Graphic",
      "esri/geometry/Point",
      "esri/geometry/Polyline",
      "esri/geometry/Polygon",
    ]);

    Graphic = GraphicMod;
    Point = PointMod;
    Polyline = PolylineMod;
    Polygon = PolygonMod;
    GraphicsLayerCtor = GraphicsLayer;

    const map = mapEl.map;
    view = mapEl.view;

    resultsLayer = new GraphicsLayer({ title: "GeoSearch — results" });
    supportingLayer = new GraphicsLayer({ title: "GeoSearch — why this result" });
    map.addMany([resultsLayer, supportingLayer]);

    refLayer = new VectorTileLayer({
      portalItem: { id: "30d6b8271e1849cd9c3042060001f425" },
      visible: false,
      title: "Reference labels",
    });
    map.add(refLayer);

    try {
      const resp = await fetch("https://s3-us-west-2.amazonaws.com/config.maptiles.arcgis.com/waybackconfig.json");
      if (!resp.ok) throw new Error("wayback config unavailable");
      const cfg = await resp.json();
      const releases = Object.values(cfg)
        .map(r => ({ ...r, date: parseDateFromTitle(r.itemTitle) }))
        .filter(r => r.date)
        .sort((a, b) => a.date - b.date);

      if (releases.length){
        const picks = {
          "2014": releases[0],
          "2022": nearestByDate(releases, new Date("2022-06-01")),
          "latest": releases[releases.length - 1],
        };
        for (const [key, rel] of Object.entries(picks)){
          waybackLayers[key] = new WebTileLayer({
            urlTemplate: rel.itemURL,
            title: rel.itemTitle,
            copyright: "Esri, Maxar, Earthstar Geographics",
            visible: false,
          });
          map.add(waybackLayers[key]);
        }
        imageryCaption.textContent = `Showing current map · Wayback back to ${picks["2014"].date.toISOString().slice(0,10)}`;
        refToggle.disabled = false;
      }
    } catch (err) {
      console.warn("Wayback imagery unavailable:", err);
      yearPills.querySelectorAll(".qe-year-pill").forEach(b => {
        if (b.dataset.year !== "none"){ b.disabled = true; }
      });
      imageryCaption.textContent = "Historical imagery needs network access to Esri tile services.";
    }
  }

  function bringSearchLayersToFront(){
    const map = mapEl.map;
    Object.values(contextGraphicsLayers).forEach(layer => map.reorder(layer, map.layers.length - 1));
    if (resultsLayer) map.reorder(resultsLayer, map.layers.length - 1);
    if (supportingLayer) map.reorder(supportingLayer, map.layers.length - 1);
  }

  function selectYear(year){
    yearPills.querySelectorAll(".qe-year-pill").forEach(b => {
      const active = b.dataset.year === year;
      b.appearance = active ? "solid" : "outline";
      b.kind = active ? "brand" : "neutral";
    });
    const baseLayer = mapEl.map?.basemap?.baseLayers?.getItemAt?.(0);
    if (baseLayer) baseLayer.visible = (year === "none");
    Object.entries(waybackLayers).forEach(([key, layer]) => { layer.visible = (key === year); });
    bringSearchLayersToFront();
  }

  yearPills.querySelectorAll(".qe-year-pill").forEach(btn => {
    btn.addEventListener("click", () => selectYear(btn.dataset.year));
  });

  refToggle.addEventListener("calciteSwitchChange", () => {
    if (refLayer) refLayer.visible = refToggle.checked;
  });

  // ---------------------------------------------------------------
  // 3. Search Data Conversions & Feature Symbolizers
  // ---------------------------------------------------------------
  function geojsonToResults(gj){
    if (!gj || !gj.features) return [];

    return gj.features.map((f, idx) => {
      let lon, lat;

      if (f.geometry) {
        const type = f.geometry.type;
        const c = f.geometry.coordinates;

        if (type === "Point") {
          lon = c[0];
          lat = c[1];
        } else if (type === "LineString") {
          lon = c[Math.floor(c.length / 2)][0];
          lat = c[Math.floor(c.length / 2)][1];
        } else if (type === "MultiLineString") {
          lon = c[0][Math.floor(c[0].length / 2)][0];
          lat = c[0][Math.floor(c[0].length / 2)][1];
        } else if (type === "Polygon") {
          lon = c[0][0][0];
          lat = c[0][0][1];
        } else if (type === "MultiPolygon") {
          lon = c[0][0][0][0];
          lat = c[0][0][0][1];
        }
      }

      return {
        name: f.properties?.name || f.properties?.title || f.properties?.LABEL || f.properties?.id || `Feature ${idx + 1}`,
        cat: f.properties?.category || f.properties?.type || f.properties?.CLASS || "Why this result?",
        lon: lon ?? -121.95,
        lat: lat ?? 37.42,
        score: f.properties?.score ?? f.properties?.confidence ?? 1.0,
        geometry: f.geometry || null,
      };
    });
  }

  function buildGeometry(geojsonGeom) {
    if (!geojsonGeom) return null;
    const type = geojsonGeom.type;
    const c = geojsonGeom.coordinates;

    if (type === "Point") {
      return new Point({ longitude: c[0], latitude: c[1] });
    } else if (type === "LineString") {
      return new Polyline({ paths: [c.map(pt => [pt[0], pt[1]])], spatialReference: { wkid: 4326 } });
    } else if (type === "MultiLineString") {
      return new Polyline({ paths: c.map(ring => ring.map(pt => [pt[0], pt[1]])), spatialReference: { wkid: 4326 } });
    } else if (type === "Polygon") {
      return new Polygon({ rings: c.map(ring => ring.map(pt => [pt[0], pt[1]])), spatialReference: { wkid: 4326 } });
    } else if (type === "MultiPolygon") {
      const rings = [];
      c.forEach(poly => poly.forEach(ring => rings.push(ring.map(pt => [pt[0], pt[1]]))));
      return new Polygon({ rings, spatialReference: { wkid: 4326 } });
    }
    return null;
  }

  function buildSymbol(geojsonGeom, isTop, colorOverride) {
    const type = geojsonGeom?.type;
    const fillColor = isTop ? [109, 41, 204, 0.35] : [0, 122, 194, 0.30];
    const lineColor = isTop ? [138, 43, 226, 1.0] : [0, 112, 224, 1.0];

    if (type === "LineString" || type === "MultiLineString") {
      return {
        type: "simple-line",
        color: colorOverride || lineColor,
        width: isTop ? 4 : 3,
        style: "solid",
      };
    } else if (type === "Polygon" || type === "MultiPolygon") {
      return {
        type: "simple-fill",
        color: colorOverride || fillColor,
        outline: { color: colorOverride || lineColor, width: 2 },
        style: "solid",
      };
    }
    return {
      type: "simple-marker",
      style: "circle",
      color: colorOverride || (isTop ? [109, 41, 204, 0.9] : [0, 122, 194, 0.85]),
      size: isTop ? 13 : 10,
      outline: { color: "#ffffff", width: 1.5 },
    };
  }

  function buildContextSymbol(geojsonGeom, color) {
    const type = geojsonGeom?.type;
    const fill = color.fill;
    const stroke = color.stroke;
    if (type === "LineString" || type === "MultiLineString") {
      return { type: "simple-line", color: stroke, width: 2.5, style: "dash" };
    } else if (type === "Polygon" || type === "MultiPolygon") {
      return { type: "simple-fill", color: fill, outline: { color: stroke, width: 1.5 }, style: "solid" };
    }
    return { type: "simple-marker", style: "circle", color: stroke, size: 9, outline: { color: "#fff", width: 1 } };
  }

  function buildSupportingSymbol(geojsonGeom, color) {
    const type = geojsonGeom?.type;
    const stroke = color.stroke;
    if (type === "LineString" || type === "MultiLineString") {
      return { type: "simple-line", color: stroke, width: 2.5, style: "short-dash" };
    } else if (type === "Polygon" || type === "MultiPolygon") {
      return { type: "simple-fill", color: [...stroke.slice(0,3), 0.20], outline: { color: stroke, width: 2, style: "dash" }, style: "solid" };
    }
    return { type: "simple-marker", style: "diamond", color: stroke, size: 12, outline: { color: "#fff", width: 1.5 } };
  }

  // Helper to calculate the closest point on a line segment to a point
  function getClosestPointOnSegment(p, a, b) {
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    if (dx === 0 && dy === 0) return a;
    let t = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy);
    t = Math.max(0, Math.min(1, t));
    return [a[0] + t * dx, a[1] + t * dy];
  }

  // Helper to calculate closest point on a LineString / MultiLineString to a target Point
  function getClosestPointOnLine(pt, coordinates, type) {
    let minSqDist = Infinity;
    let closestPt = pt;

    const lines = type === "LineString" ? [coordinates] : coordinates;
    lines.forEach(line => {
      for (let i = 0; i < line.length - 1; i++) {
        const segPt = getClosestPointOnSegment(pt, line[i], line[i + 1]);
        const sqDist = Math.pow(pt[0] - segPt[0], 2) + Math.pow(pt[1] - segPt[1], 2);
        if (sqDist < minSqDist) {
          minSqDist = sqDist;
          closestPt = segPt;
        }
      }
    });
    return closestPt;
  }

  // Helper to calculate centroid of a Polygon / MultiPolygon
  function getPolygonCentroid(coordinates, type) {
    let ring = [];
    if (type === "Polygon") {
      ring = coordinates[0];
    } else if (type === "MultiPolygon") {
      ring = coordinates[0][0];
    }
    if (!ring || !ring.length) return [0, 0];

    let area = 0, cx = 0, cy = 0;
    for (let i = 0; i < ring.length - 1; i++) {
      const p1 = ring[i];
      const p2 = ring[i + 1];
      const f = (p1[0] * p2[1] - p2[0] * p1[1]);
      area += f;
      cx += (p1[0] + p2[0]) * f;
      cy += (p1[1] + p2[1]) * f;
    }
    area = area * 0.5;
    if (area === 0) return ring[0];
    return [cx / (6 * area), cy / (6 * area)];
  }

  function getGeoJsonCenter(geojsonGeom, refPoint) {
    if (!geojsonGeom) return null;
    const type = geojsonGeom.type;
    const c = geojsonGeom.coordinates;

    if (type === "Point") {
      return c;
    }
    if (type === "LineString" || type === "MultiLineString") {
      return refPoint ? getClosestPointOnLine(refPoint, c, type) : c[0];
    }
    if (type === "Polygon" || type === "MultiPolygon") {
      return getPolygonCentroid(c, type);
    }
    return null;
  }

  function buildConnectionLine(fromGeom, toGeom) {
    if (!fromGeom || !toGeom) return null;

    let fromPt, toPt;

    if (fromGeom.type === "Point") {
      fromPt = getGeoJsonCenter(fromGeom);
      toPt = getGeoJsonCenter(toGeom, fromPt);
    } else if (toGeom.type === "Point") {
      toPt = getGeoJsonCenter(toGeom);
      fromPt = getGeoJsonCenter(fromGeom, toPt);
    } else {
      fromPt = getGeoJsonCenter(fromGeom);
      toPt = getGeoJsonCenter(toGeom);
    }

    if (!fromPt || !toPt) return null;
    return new Polyline({
      paths: [[fromPt, toPt]],
      spatialReference: { wkid: 4326 },
    });
  }

  function getLayerColor(artifact, typeCounts) {
    const baseType = artifact.type?.split(":")[0] || artifact.type;
    const base = TYPE_COLORS[baseType] || { fill: [100,100,100,0.25], stroke: [100,100,100,0.85], hex: "#666" };

    const count = typeCounts[baseType] || 0;
    typeCounts[baseType] = count + 1;

    if (count === 0) return { fill: base.fill, stroke: base.stroke, hex: base.hex };

    const shades = baseType === "geocode" ? GEOCODE_VARIATION_SHADES : VARIATION_SHADES;
    const v = shades[count % shades.length] || shades[0];
    const hex = `#${v.stroke.slice(0,3).map(c => c.toString(16).padStart(2,"0")).join("")}`;
    return { fill: v.fill, stroke: v.stroke, hex };
  }

  // ---------------------------------------------------------------
  // 4. Context & Supporting Feature Display Handlers
  // ---------------------------------------------------------------
  function clearContextLayers(){
    const map = mapEl.map;
    Object.values(contextGraphicsLayers).forEach(layer => map.remove(layer));
    contextGraphicsLayers = {};
  }

  function buildContextLayer(artifact, color){
    const layer = new GraphicsLayerCtor({
      title: `Context — ${artifact.label}`,
      visible: artifact.default_visible !== false,
    });

    const features = artifact.geojson?.features;
    if (!features || !features.length){
      console.warn(`[GeoSearch] context artifact "${artifact.id}" ("${artifact.label}") has no geojson features to draw.`, artifact);
      return layer;
    }

    features.forEach(f => {
      const geom = buildGeometry(f.geometry);
      if (!geom){
        console.warn(`[GeoSearch] could not build a map geometry for a feature of context artifact "${artifact.id}".`, f);
        return;
      }
      layer.add(new Graphic({
        geometry: geom,
        symbol: buildContextSymbol(f.geometry, color),
        attributes: { name: artifact.label, contextLayer: true, artifactId: artifact.id },
      }));
    });

    return layer;
  }

  function renderContextChips(bundle) {
    contextChips.innerHTML = "";
    clearContextLayers();
    if (!bundle?.context?.length) return;

    const typeCounts = {};
    const newLayers = [];

    bundle.context.forEach(art => {
      const color = getLayerColor(art, typeCounts);
      const layer = buildContextLayer(art, color);
      contextGraphicsLayers[art.id] = layer;
      newLayers.push(layer);

      const chip = document.createElement("span");
      chip.className = "qe-chip" + (layer.visible ? " active" : "");
      chip.innerHTML = `<span class="qe-chip-dot" style="background:${color.hex}"></span>${art.label}`;
      chip.addEventListener("click", () => {
        layer.visible = !layer.visible;
        chip.classList.toggle("active", layer.visible);
      });
      contextChips.appendChild(chip);
    });

    mapEl.map.addMany(newLayers);
    bringSearchLayersToFront();
  }

  function renderResults(query, results, bundle){
    resultsWrap.hidden = false;
    resultsList.innerHTML = "";
    resultsLayer.removeAll();
    supportingLayer.removeAll();
    supportingGraphics = {};
    supportingVisible = {};
    featureCentroids = [];
    currentBundle = bundle;

    if (!results.length){
      resultsMeta.textContent = `No matches for "${query}"`;
      const empty = document.createElement("div");
      empty.className = "qe-empty";
      empty.textContent = "Our Search Engine couldn't find a match. The feature doesn't exist in the area.";
      resultsList.appendChild(empty);
      contextChips.innerHTML = "";
      clearContextLayers();
      return;
    }

    resultsMeta.textContent = `${results.length} result${results.length === 1 ? "" : "s"} for "${query}"`;

    renderContextChips(bundle);

    const featureChecks = bundle?.features || [];
    const extentGeometries = [];

    results.forEach((r, idx) => {
      const item = document.createElement("calcite-list-item");
      item.label = r.name;
      item.description = r.cat;
      item.addEventListener("click", () => focusResult(r));
      resultsList.appendChild(item);

      const geom = buildGeometry(r.geometry);
      if (!geom) {
        console.warn(`[GeoSearch] result "${r.name}" has no usable geometry — skipped on the map.`, r);
        return;
      }
      extentGeometries.push(geom);

      const center = geom?.extent?.center || (r.geometry?.type === "Point" ? { longitude: r.lon, latitude: r.lat } : null);
      if (center) {
        featureCentroids[idx] = [center.longitude ?? r.lon, center.latitude ?? r.lat];
      }

      const featData = featureChecks[idx] || null;

      const graphic = new Graphic({
        geometry: geom,
        symbol: buildSymbol(r.geometry, idx === 0),
        attributes: { name: r.name, cat: r.cat, featureIndex: idx },
        popupTemplate: {
          title: "{name}",
          content: () => buildPopupContent(r.cat, featData, idx),
        },
      });
      graphic._featData = featData;
      graphic._resultGeom = r.geometry;
      graphic._resultIdx = idx;
      resultsLayer.add(graphic);
    });

    if (view){
      bundle?.context?.forEach(art => {
        if (art.default_visible === false) return;
        art.geojson?.features?.forEach(f => {
          const g = buildGeometry(f.geometry);
          if (g) extentGeometries.push(g);
        });
      });
      if (extentGeometries.length){
        view.goTo(extentGeometries, { duration: 700 })
          .catch(err => console.warn("[GeoSearch] view.goTo failed:", err));
      }
    }
  }

  function applyPillStyle(pill, isActive, hasGeom) {
    const bg = isActive ? "#e6f0fb" : "#f5f5f5";
    const border = isActive ? "#007ac2" : "#d8d8d8";
    const textColor = isActive ? "#007ac2" : "#333333";
    pill.style.cssText = `display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:500;border:1px solid ${border};background:${bg};color:${textColor};cursor:${hasGeom ? "pointer" : "default"};opacity:${hasGeom ? "1" : "0.6"};user-select:none;margin-bottom:4px;`;
  }

  function buildPopupContent(cat, featData, featureIdx) {
    const container = document.createElement("div");
    container.style.cssText = "font-size:13px;color:#333;max-width:320px;font-family:sans-serif;";

    const catEl = document.createElement("div");
    catEl.style.cssText = "margin-bottom:8px;color:#6a6a6a;font-size:12px;font-weight:500;";
    catEl.textContent = cat;
    container.appendChild(catEl);

    if (!featData?.checks?.length) {
      const empty = document.createElement("div");
      empty.style.cssText = "font-size:11px;color:#888;";
      empty.textContent = "No spatial validation parameters recorded.";
      container.appendChild(empty);
      return container;
    }

    const pillsWrap = document.createElement("div");
    pillsWrap.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;";

    featData.checks.forEach((check, ci) => {
      const hasGeom = !!check.geometry;
      const isActive = !!(supportingVisible[featureIdx]?.[check.label]);

      const pill = document.createElement("span");
      pill.dataset.fi = String(featureIdx);
      pill.dataset.ci = String(ci);
      applyPillStyle(pill, isActive, hasGeom);
      pill.title = check.detail || check.label;

      const dot = document.createElement("span");
      dot.style.cssText = `width:7px;height:7px;border-radius:50%;flex:none;background:${check.passed ? "#22863a" : "#cb2431"};`;
      pill.appendChild(dot);

      const label = document.createElement("span");
      label.textContent = check.label;
      pill.appendChild(label);

      if (check.detail) {
        const detail = document.createElement("span");
        detail.style.cssText = "font-size:10px;opacity:0.75;margin-left:2px;";
        detail.textContent = `(${check.detail})`;
        pill.appendChild(detail);
      }

      if (hasGeom) {
        pill.addEventListener("click", () => {
          supportingVisible[featureIdx] = supportingVisible[featureIdx] || {};
          const nowVisible = !supportingVisible[featureIdx][check.label];
          supportingVisible[featureIdx][check.label] = nowVisible;
          applyPillStyle(pill, nowVisible, true);

          const resultGeom = findResultGeometry(featureIdx);
          toggleSupportingFeature(featureIdx, check, resultGeom);
        });
      }

      pillsWrap.appendChild(pill);
    });

    container.appendChild(pillsWrap);
    return container;
  }

  function findResultGeometry(featureIdx) {
    const g = resultsLayer?.graphics?.find(gr => gr.attributes?.featureIndex === featureIdx);
    if (!g?.geometry) return null;
    const geom = g.geometry;
    if (geom.type === "point") {
      return { type: "Point", coordinates: [geom.longitude, geom.latitude] };
    }
    if (geom.type === "polyline" && geom.paths?.length) {
      return { type: "LineString", coordinates: geom.paths[0] };
    }
    if (geom.type === "polygon" && geom.rings?.length) {
      return { type: "Polygon", coordinates: geom.rings };
    }
    return null;
  }

  const SUPPORTING_PALETTE = [
    { fill: [220, 80, 60, 0.18], stroke: [220, 80, 60, 0.9] },
    { fill: [30, 140, 80, 0.18],  stroke: [30, 140, 80, 0.9] },
    { fill: [200, 140, 0, 0.18],  stroke: [200, 140, 0, 0.9] },
    { fill: [100, 80, 200, 0.18], stroke: [100, 80, 200, 0.9] },
    { fill: [0, 160, 200, 0.18],  stroke: [0, 160, 200, 0.9] },
    { fill: [200, 50, 150, 0.18], stroke: [200, 50, 150, 0.9] },
  ];

  function supportingColorFor(label) {
    let h = 0;
    for (let i = 0; i < label.length; i++) { h = ((h << 5) - h + label.charCodeAt(i)) | 0; }
    return SUPPORTING_PALETTE[Math.abs(h) % SUPPORTING_PALETTE.length];
  }

  function toggleSupportingFeature(featureIdx, check, featureGeometry) {
    const isVisible = supportingVisible[featureIdx]?.[check.label];

    if (!supportingGraphics[featureIdx]) supportingGraphics[featureIdx] = {};
    const existing = supportingGraphics[featureIdx][check.label];

    if (existing) {
      existing.forEach(g => { g.visible = isVisible; });
      return;
    }

    if (!isVisible || !supportingLayer) return;

    const grs = [];
    const checkGeom = buildGeometry(check.geometry);
    if (!checkGeom){
      console.warn(`[GeoSearch] "why this result" check "${check.label}" has no geometry to draw.`, check);
      return;
    }

    const color = supportingColorFor(check.label);

    grs.push(new Graphic({
      geometry: checkGeom,
      symbol: buildSupportingSymbol(check.geometry, color),
      attributes: { name: check.label, supporting: true },
      popupTemplate: { title: check.label, content: check.detail || "" },
    }));

    const line = buildConnectionLine(featureGeometry, check.geometry);
    if (line) {
      grs.push(new Graphic({
        geometry: line,
        symbol: { type: "simple-line", color: [...color.stroke.slice(0,3), 0.6], width: 1.5, style: "short-dash" },
        attributes: { name: `Connection to ${check.label}`, supporting: true },
      }));
    }

    supportingGraphics[featureIdx][check.label] = grs;
    grs.forEach(g => supportingLayer.add(g));
  }

  function focusResult(r){
    if (!view) return;
    if (r.geometry && (r.geometry.type === "Polygon" || r.geometry.type === "MultiPolygon" ||
        r.geometry.type === "LineString" || r.geometry.type === "MultiLineString")) {
      const geom = buildGeometry(r.geometry);
      if (geom) {
        view.goTo({ target: geom, zoom: 15 }, { duration: 600 });
        const g = resultsLayer.graphics.find(gr => gr.attributes?.name === r.name);
        if (g) view.openPopup({ features: [g], location: geom.extent?.center || g.geometry });
        return;
      }
    }
    view.goTo({ center: [r.lon, r.lat], zoom: 15 }, { duration: 600 });
    const g = resultsLayer.graphics.find(gr => gr.attributes?.name === r.name);
    if (g) view.openPopup({ features: [g], location: g.geometry });
  }

  // ---------------------------------------------------------------
  // Simulated Loading Progress Controller
  // ---------------------------------------------------------------
  let progressTimer = null;

  function startSimulatedProgress() {
    if (progressTimer) clearInterval(progressTimer);
    
    progressBarWrap.hidden = false;
    progressFill.style.transition = "width 0.15s ease-out";
    progressFill.style.width = "0%";
    
    let currentPercent = 0;
    const intervalMs = 100;
    const totalTargetMs = 10000;
    const steps = totalTargetMs / intervalMs;
    const targetPercent = 80;
    const baseIncrement = targetPercent / steps;

    progressTimer = setInterval(() => {
      if (currentPercent < targetPercent) {
        // Add pseudo-random variations to make progress feel natural
        const jitter = (Math.random() * 0.8) + 0.6;
        currentPercent += baseIncrement * jitter;
        if (currentPercent > targetPercent) currentPercent = targetPercent;
      }
      progressFill.style.width = `${currentPercent}%`;
    }, intervalMs);
  }

  function finishSimulatedProgress() {
    return new Promise(resolve => {
      if (progressTimer) clearInterval(progressTimer);
      progressFill.style.transition = "width 0.25s ease-in-out";
      progressFill.style.width = "100%";
      
      setTimeout(() => {
        progressBarWrap.hidden = true;
        progressFill.style.width = "0%";
        resolve();
      }, 300);
    });
  }

  async function runQuery(query){
    const q = (query ?? queryInput.value).trim();
    if (!q) return;
    
    queryInput.value = q;
    runBtn.loading = true;
    runBtn.disabled = true;
    resultsWrap.hidden = false;
    resultsMeta.textContent = "Searching spatial database...";
    resultsList.innerHTML = "";
    contextChips.innerHTML = "";

    startSimulatedProgress();

    let results = [];
    let bundle = null;
    try {
      const resp = await fetch(`${API_BASE}/api/predict`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
              query: q,
              api_key: userApiKey
          }),
          signal: AbortSignal.timeout(600000)
      });

      if (!resp.ok) {
        const errorText = await resp.text();
        throw new Error(`Server returned ${resp.status}: ${errorText}`);
      }

      const data = await resp.json();
      bundle = data.bundle || null;
      if (!bundle) {
        console.warn('[GeoSearch] /api/predict response had no "bundle" field — context layers and "why this result" will be empty. Response keys:', Object.keys(data || {}));
      }
      results = geojsonToResults(data.geojson || data);
      
      if (results.length === 0) {
        console.warn("GeoDataFrame returned empty by query engine");
      }
    } catch (err) {
      console.error("API Prediction Failed! Reason:", err);
      alert(`Query failed: ${err.message}`);
    } finally {
      await finishSimulatedProgress();
    }

    renderResults(q, results, bundle);
    runBtn.loading = false;
    runBtn.disabled = false;
  }

  runBtn.addEventListener("click", () => runQuery());
  queryInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      runQuery();
    }
  });

  mapEl.addEventListener("arcgisViewReadyChange", async () => {
    await setupMap();
  }, { once: true });
</script>
